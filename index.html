<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mascota Matemática — Papel Quest</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F1E4C3;--paper-dark:#E4D3A8;--ink:#2B2118;--teal:#1E6F5C;--teal-dark:#154F42;--red:#C1443B;--gold:#D9A441;--steel:#4C6B82;--white-paper:#FBF6E9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:repeating-linear-gradient(45deg,rgba(0,0,0,0.015)0 2px,transparent 2px 6px),var(--paper);font-family:Nunito,sans-serif;color:var(--ink);overflow:hidden;user-select:none;touch-action:manipulation}
h1,h2,h3{font-family:'Baloo 2',sans-serif}
.torn{clip-path:polygon(0% 2%,3% 0%,8% 1.5%,14% 0%,20% 1.8%,27% 0.2%,34% 1.6%,41% 0%,48% 1.2%,55% 0.3%,62% 1.7%,69% 0.1%,76% 1.4%,83% 0.5%,90% 1.9%,97% 0.4%,100% 2%,100% 98%,97% 100%,91% 98.4%,84% 100%,77% 98.2%,70% 99.8%,63% 98.3%,56% 100%,49% 98.7%,42% 99.6%,35% 98.2%,28% 99.9%,21% 98.5%,14% 99.7%,7% 98.3%,0% 100%)}
#app{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
.btn{font-family:'Baloo 2',sans-serif;font-weight:700;border:none;border-radius:10px;cursor:pointer;transition:transform .08s,box-shadow .08s;font-size:14px;padding:8px 20px;color:var(--white-paper);background:var(--teal);box-shadow:0 4px 0 var(--teal-dark)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--teal-dark)}
.btn.gold{background:var(--gold);color:var(--ink);box-shadow:0 4px 0 #b8882e}
.btn.red{background:var(--red);box-shadow:0 4px 0 var(--red-dark)}

/* MAIN GAME */
#game-wrap{background:var(--white-paper);border:5px solid var(--ink);border-radius:2rem;padding:16px 20px 18px;width:480px;max-width:96vw;box-shadow:0 10px 0 -4px rgba(0,0,0,.12),0 6px 24px rgba(0,0,0,.2);position:relative}
#game-wrap .top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
#game-wrap .top-bar h1{font-size:17px;color:var(--teal-dark);margin:0}
#game-wrap .top-bar .star-count{font-weight:800;font-size:13px}
.pet-area{text-align:center;padding:6px 0;position:relative;min-height:110px}
.pet-area .pet-emoji{font-size:64px;display:block;cursor:pointer;transition:transform .1s;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.pet-area .pet-emoji:active{transform:scale(1.2)}
.pet-area .pet-name{font-weight:800;font-size:15px;margin:2px 0 0}
.pet-area .pet-mood{font-size:11px;color:#5a4c38;min-height:16px}

/* LEVEL BAR */
.level-bar{display:flex;align-items:center;gap:6px;margin:4px 0 2px}
.level-bar .lv-label{font-weight:800;font-size:11px;color:var(--teal-dark);font-family:'Baloo 2';white-space:nowrap}
.level-bar .lv-wrap{flex:1;height:10px;background:#ddd0ad;border-radius:5px;overflow:hidden;border:1px solid var(--ink)}
.level-bar .lv-fill{height:100%;background:linear-gradient(90deg,var(--teal),#3aa17c);border-radius:5px;transition:width .4s}
.level-bar .lv-xp{font-size:10px;font-weight:800;color:#5a4c38;white-space:nowrap}

/* STATS */
.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:6px 0}
.stat-item{background:var(--paper);border:2px solid var(--ink);border-radius:8px;padding:5px 8px;display:flex;align-items:center;gap:6px}
.stat-item .s-icon{font-size:14px;width:20px;text-align:center}
.stat-item .s-bar-wrap{flex:1;height:8px;background:#ddd0ad;border-radius:4px;overflow:hidden}
.stat-item .s-bar{height:100%;border-radius:4px;transition:width .3s}
.s-hambre .s-bar{background:linear-gradient(90deg,#f7971e,#ffd200)}
.s-felicidad .s-bar{background:linear-gradient(90deg,#ff4081,#f50057)}
.s-energia .s-bar{background:linear-gradient(90deg,#4caf50,#66bb6a)}
.s-salud .s-bar{background:linear-gradient(90deg,#2196f3,#42a5f5)}
.stat-item .s-val{font-size:10px;font-weight:800;min-width:22px;text-align:right}

/* GAME MODE BUTTONS */
.games-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:5px;margin:8px 0}
.game-btn{background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:12px 4px;cursor:pointer;transition:transform .1s;text-align:center;touch-action:manipulation}
.game-btn:active{transform:scale(.95)}
.game-btn .g-icon{font-size:26px;display:block}
.game-btn .g-title{font-weight:800;font-size:11px;margin:2px 0}
.game-btn .g-reward{font-size:9px;color:#5a4c38}
.game-btn.locked{opacity:.4;pointer-events:none}

/* PUZZLE OVERLAY */
.overlay{display:none;position:absolute;inset:0;background:rgba(20,14,8,0.5);z-index:10;border-radius:2rem;align-items:center;justify-content:center}
.overlay.show{display:flex}
.panel{background:var(--white-paper);border:4px solid var(--ink);border-radius:1.5rem;padding:18px 16px;min-width:280px;width:92vw;max-width:400px;text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.panel h2{font-size:18px;color:var(--teal-dark);margin:0 0 4px}
.panel .sub{font-size:11px;color:#5a4c38;margin-bottom:8px}
.panel .math{font-size:34px;font-weight:900;margin:8px 0;font-family:'Baloo 2'}
.panel .math .sym{color:var(--gold)}
.panel .math .eq{color:var(--teal)}
.panel .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.panel .opt{background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:12px 6px;font-size:20px;font-weight:800;cursor:pointer;font-family:'Baloo 2';transition:transform .1s;touch-action:manipulation;min-height:48px}
.panel .opt:active{transform:scale(.95);background:var(--paper-dark)}
.panel .opt.correct{background:#8fd19e;border-color:var(--teal)}
.panel .opt.wrong{background:#e08a7a;border-color:var(--red)}
.panel .msg{font-size:12px;font-weight:800;min-height:18px}
.panel .msg.good{color:var(--teal)}
.panel .msg.bad{color:var(--red)}
.panel .timer-bar{height:10px;background:#ddd0ad;border-radius:4px;overflow:hidden;margin:6px 0}
.panel .timer-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--red));border-radius:4px;transition:width .15s}
.panel .streak{font-size:11px;color:#5a4c38}

/* GRID */
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px auto;max-width:260px}
.gcell{aspect-ratio:1;background:var(--paper);border:3px solid var(--ink);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;cursor:pointer;font-family:'Baloo 2';touch-action:manipulation}
.gcell:active{transform:scale(.92)}
.gcell.sel{background:var(--gold);border-color:var(--teal-dark);transform:scale(1.06)}
.gcell.ok{background:#8fd19e;border-color:var(--teal);cursor:default;opacity:.6}
.gcell.bad{background:#e08a7a;border-color:var(--red);animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}

/* MEMORY */
.seq-row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px 0;min-height:56px}
.snum{width:48px;height:58px;background:rgba(255,255,255,.3);border:3px solid var(--ink);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;font-family:'Baloo 2';transition:all .3s;animation:fadeIn .25s}
.snum.hide{color:transparent;border-color:#ddd0ad;transform:scale(.95)}
@keyframes fadeIn{0%{opacity:0;transform:translateY(8px)scale(.85)}100%{opacity:1;transform:translateY(0)scale(1)}}

/* EVOLUTION BADGE */
.evo-badge{display:inline-block;background:var(--teal);color:#fff;font-size:9px;padding:2px 10px;border-radius:10px;font-weight:700;letter-spacing:1px;margin-bottom:4px}

/* CLOSE X */
.close-x{position:absolute;top:-10px;right:-10px;font-size:22px;font-weight:800;cursor:pointer;color:#fff;background:var(--red);width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:15;box-shadow:0 2px 6px rgba(0,0,0,.4);transition:transform .1s}
.close-x:hover{transform:scale(1.15)}

/* META + HUD ROW */
.hud-row{display:flex;align-items:center;gap:6px;margin:2px 0 6px}
.hud-chip{background:var(--paper);border:2px solid var(--ink);border-radius:20px;padding:2px 10px;font-weight:800;font-size:11px;display:flex;align-items:center;gap:4px;font-family:'Baloo 2'}
.hud-chip.racha{color:var(--red)}
.hud-chip.vidas span{color:var(--red)}
.hud-chip.meta{flex:1}
.hud-chip.meta .m-wrap{flex:1;height:8px;background:#ddd0ad;border-radius:4px;overflow:hidden}
.hud-chip.meta .m-fill{height:100%;background:linear-gradient(90deg,#8fd19e,var(--gold));border-radius:4px;transition:width .3s}
.hud-btn{cursor:pointer;border:2px solid var(--ink);border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:15px;background:var(--paper);transition:transform .1s}
.hud-btn:active{transform:scale(.9)}
.hud-btn.disabled{opacity:.35;pointer-events:none}

/* EVENTO ESTRELLA */
#eventoStar{position:absolute;top:2px;left:50%;margin-left:-14px;font-size:28px;cursor:pointer;display:none;animation:pulseStar 1s ease-in-out infinite;filter:drop-shadow(0 0 6px var(--gold));z-index:5}
@keyframes pulseStar{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
#eventoBadge{position:absolute;top:2px;left:50%;margin-left:-20px;background:var(--gold);border:2px solid var(--ink);border-radius:16px;padding:2px 8px;font-weight:800;font-size:11px;display:none;z-index:5;font-family:'Baloo 2'}

/* BURBUJA DE MASCOTA */
#petBubble{position:absolute;top:-18px;right:4px;background:var(--white-paper);border:2px solid var(--ink);border-radius:12px;padding:4px 10px;font-size:11px;font-weight:800;box-shadow:0 3px 8px rgba(0,0,0,.2);opacity:0;transition:opacity .3s;pointer-events:none;z-index:6;max-width:170px}
#petBubble::after{content:'';position:absolute;bottom:-8px;left:14px;border:6px solid transparent;border-top:6px solid var(--ink);border-bottom:0}

/* WHEEL */
.rueda-circle{width:190px;height:190px;border-radius:50%;position:relative;margin:10px auto;border:5px solid var(--ink);box-shadow:0 4px 10px rgba(0,0,0,.25);transition:transform 3.2s cubic-bezier(.15,.7,.2,1)}
.rueda-ptr{position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:24px;color:var(--red);z-index:3;text-shadow:0 2px 3px rgba(0,0,0,.3)}
.rueda-sector{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.rueda-sector span{transform:translateY(-66px);font-size:26px}

/* LOGROS */
.logro-item{display:flex;align-items:center;gap:8px;background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:6px 10px;margin:4px 0;font-size:12px;font-weight:800}
.logro-item.locked{opacity:.4;filter:grayscale(1)}

/* TOAST */
#toast{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--white-paper);padding:4px 14px;font-weight:800;font-family:'Baloo 2';z-index:20;opacity:0;transition:opacity .3s;pointer-events:none;border-radius:6px;font-size:12px}
@media(max-width:420px){
  #game-wrap{border-radius:1.2rem;padding:12px 10px 14px;width:100vw;max-width:100vw;border-left:none;border-right:none;border-bottom-width:4px}
  .pet-area .pet-emoji{font-size:50px}
  .stats-row{gap:4px}
  .stat-item{padding:4px 6px;border-radius:6px}
  .stat-item .s-val{font-size:9px;min-width:18px}
  .stat-item .s-icon{font-size:12px;width:16px}
  .games-row{gap:4px}
  .game-btn{border-radius:8px;padding:8px 2px}
  .game-btn .g-icon{font-size:22px}
  .game-btn .g-title{font-size:10px}
  .panel{border-radius:1rem;padding:14px 10px;width:96vw;min-width:unset}
  .panel .math{font-size:28px}
  .panel .opt{padding:10px 4px;font-size:18px;min-height:44px}
  .grid-4{gap:4px;max-width:210px}
  .gcell{font-size:16px;border-radius:8px}
  .snum{width:38px;height:48px;font-size:18px}
}
</style>
</head>
<body>
<div id="app">
<div id="game-wrap">
  <div class="top-bar">
    <h1>📐 Mascota Matemática</h1>
    <span>
      <span class="star-count">⭐ <span id="totalStars">0</span></span>
      <span class="hud-btn" style="margin-left:6px" onclick="abrirLogros()" title="Logros">🏆</span>
      <span class="hud-btn" id="btnRueda" onclick="abrirRueda()" title="Recompensa diaria">🎡</span>
      <span class="hud-btn" style="margin-left:6px" onclick="mostrarInstrucciones()" title="¿Cómo se juega?">❓</span>
    </span>
  </div>

  <div class="pet-area">
    <span id="eventoStar" onclick="activarEvento()">✨</span>
    <span id="eventoBadge"></span>
    <div id="petBubble"></div>
    <span class="pet-emoji" id="petEmoji">🐣</span>
    <div class="pet-name" id="petName">Bebé Matemático</div>
    <div class="pet-mood" id="petMood">Resolvé desafíos para cuidarme</div>
  </div>

  <div class="hud-row">
    <span class="hud-chip racha" id="chipRacha" style="display:none">🔥 <span id="rachaN">0</span></span>
    <span class="hud-chip vidas">❤️ <span id="vidasN">3</span></span>
    <span class="hud-chip meta">🎯 <div class="m-wrap"><div class="m-fill" id="metaFill" style="width:0%"></div></div></span>
  </div>

  <div class="level-bar">
    <span class="lv-label" id="lvLabel">Nivel 1</span>
    <div class="lv-wrap"><div class="lv-fill" id="lvFill" style="width:0%"></div></div>
    <span class="lv-xp" id="lvXp">0/80</span>
  </div>

  <div class="stats-row">
    <div class="stat-item s-hambre"><span class="s-icon">🍖</span><div class="s-bar-wrap"><div class="s-bar" id="hambreBar" style="width:70%"></div></div><span class="s-val" id="hambreVal">70</span></div>
    <div class="stat-item s-felicidad"><span class="s-icon">😊</span><div class="s-bar-wrap"><div class="s-bar" id="felizBar" style="width:60%"></div></div><span class="s-val" id="felizVal">60</span></div>
    <div class="stat-item s-energia"><span class="s-icon">⚡</span><div class="s-bar-wrap"><div class="s-bar" id="energiaBar" style="width:80%"></div></div><span class="s-val" id="energiaVal">80</span></div>
    <div class="stat-item s-salud"><span class="s-icon">❤️</span><div class="s-bar-wrap"><div class="s-bar" id="saludBar" style="width:90%"></div></div><span class="s-val" id="saludVal">90</span></div>
  </div>

  <div class="games-row">
    <div class="game-btn" onclick="abrirJuego('calculo')">
      <span class="g-icon">🧮</span>
      <div class="g-title">Carrera</div>
      <div class="g-reward">🍖 +Hambre</div>
    </div>
    <div class="game-btn" onclick="abrirJuego('grid')">
      <span class="g-icon">⊞</span>
      <div class="g-title">Grid</div>
      <div class="g-reward">😊 +Felicidad</div>
    </div>
    <div class="game-btn" onclick="abrirJuego('memoria')">
      <span class="g-icon">⟳</span>
      <div class="g-title">Memoria</div>
      <div class="g-reward">⚡ +Energía</div>
    </div>
    <div class="game-btn" onclick="abrirJuego('ovejas')">
      <span class="g-icon">🐑</span>
      <div class="g-title">Ovejas</div>
      <div class="g-reward">💤 +Sueño</div>
    </div>
  </div>

  <div style="text-align:center;font-size:10px;color:#5a4c38;margin-top:4px">Resolvé desafíos para cuidar a tu mascota · Evoluciona con estrellas ⭐</div>

  <div id="toast"></div>
  <div class="overlay" id="overlay">
    <span class="close-x" onclick="cancelarJuego()">✕</span>
    <div class="panel torn" id="panelContenido"></div>
  </div>
</div>
</div>

<script>
// ===== PET =====
let gameCancelled=false;
const pet={hambre:70,felicidad:60,energia:80,salud:90,edad:0,estrellas:0,racha:0,_sleep:0,nivel:1,xp:0,vidas:3,vidasT:Date.now(),xpHoy:0,metaHoy:150,fechaHoy:'',logros:[],juegos:0,juegosPor:{},ultimoEvento:Date.now(),eventoActivo:false,eventoFin:0,lastVisit:Date.now(),ruedaDia:false};
const emojis=['🐣','🐤','🐔','🦅','🦉'];
function today(){return new Date().toDateString()}
function xpMax(){return 80+(pet.nivel-1)*40}
function calcularDif(){return Math.min(4,Math.floor((pet.nivel-1)/2))}
function multiplicador(){return 1+(pet.nivel-1)*0.5}

// ===== GUARDAR / CARGAR =====
function guardar(){
  try{localStorage.setItem('mascotaMath',JSON.stringify(pet))}catch(e){}
}
function cargar(){
  try{
    const d=JSON.parse(localStorage.getItem('mascotaMath'));
    if(!d)return;
    Object.assign(pet,d);
    pet._sleep=0;
    pet.ultimoEvento=Date.now();
    if(pet.fechaHoy!==today()){pet.xpHoy=0;pet.ruedaDia=false;pet.fechaHoy=today();}
  }catch(e){}
  regenerarVidas();
}
function regenerarVidas(){
  const now=Date.now();
  if(pet.vidas<3){
    const ganadas=Math.floor((now-pet.vidasT)/120000);
    if(ganadas>0){pet.vidas=Math.min(3,pet.vidas+ganadas);pet.vidasT=now;}
  }
}

// ===== BURBUJA / AVISOS =====
let bubbleT=null;
function avisar(m,ms=3200){
  const b=document.getElementById('petBubble');
  b.textContent=m;b.style.opacity=1;
  clearTimeout(bubbleT);
  bubbleT=setTimeout(()=>b.style.opacity=0,ms);
}

// ===== RACHA =====
function sumarRacha(){
  pet.racha++;
  actualizarMascota();
  if(pet.racha===5){toast('🔥 ¡Racha 5! Bonus x2');}
}
function resetRacha(){pet.racha=0;actualizarMascota()}
function rachaMult(){return pet.racha>=5?2:1}

// ===== EVENTO DOBLE XP =====
function activarEvento(){
  if(pet.eventoActivo)return;
  pet.eventoActivo=true;pet.eventoFin=Date.now()+60000;
  document.getElementById('eventoStar').style.display='none';
  document.getElementById('eventoBadge').style.display='block';
  toast('✨ ¡Doble XP por 60 segundos!');
}
function eventoMult(){return pet.eventoActivo?2:1}
function spawnEvento(){
  if(pet.eventoActivo)return;
  if(document.getElementById('eventoStar').style.display==='block')return;
  if(Date.now()-pet.ultimoEvento<180000)return;
  document.getElementById('eventoStar').style.display='block';
  avisar('✨ Toca la estrella para doble XP!');
}
function obtenerEmoji(){
  if(pet.salud<15)return '😷';
  if(pet.energia<10)return '😴';
  const idx=Math.min(4,Math.floor(pet.edad/20));
  return emojis[idx];
}
function obtenerNombre(){
  const nombres=['Bebé Matemático','Aprendiz de Números','Genio del Cálculo','Sabio Matemático','Mago Numérico'];
  return nombres[Math.min(4,Math.floor(pet.edad/20))];
}
function actualizarMascota(){
  document.getElementById('petEmoji').textContent=obtenerEmoji();
  document.getElementById('petName').textContent=obtenerNombre();
  document.getElementById('totalStars').textContent=pet.estrellas;

  const bars={hambre:pet.hambre,feliz:pet.felicidad,energia:pet.energia,salud:pet.salud};
  for(const[k,v]of Object.entries(bars)){
    document.getElementById(k+'Bar').style.width=Math.max(0,v)+'%';
    document.getElementById(k+'Val').textContent=Math.round(Math.max(0,v));
  }

  document.getElementById('lvLabel').textContent='Nivel '+pet.nivel;
  document.getElementById('lvXp').textContent=pet.xp+'/'+xpMax();
  document.getElementById('lvFill').style.width=Math.min(100,(pet.xp/xpMax())*100)+'%';

  // vidas
  regenerarVidas();
  document.getElementById('vidasN').textContent=pet.vidas;
  // racha
  const chip=document.getElementById('chipRacha');
  chip.style.display=pet.racha>=2?'flex':'none';
  document.getElementById('rachaN').textContent=pet.racha;
  // meta diaria
  const mf=document.getElementById('metaFill');
  mf.style.width=Math.min(100,(pet.xpHoy/pet.metaHoy)*100)+'%';
  document.getElementById('btnRueda').classList.toggle('disabled',pet.xpHoy<pet.metaHoy);
  if(pet.xpHoy>=pet.metaHoy&&!pet.ruedaDia){toast('🎡 ¡Meta diaria cumplida! Abrí la rueda');}

  let mood='😊 Feliz y saludable';
  if(pet.hambre<20)mood='😫 Mucha hambre!';
  else if(pet.felicidad<20)mood='😞 Triste... jugá conmigo';

  pet.xp+=total;
  pet.xpHoy+=total;
  while(pet.xp>=xpMax()){
    pet.xp-=xpMax();
    pet.nivel++;
    const d=calcularDif();
    toast('⬆️ ¡Nivel '+pet.nivel+'! Dificultad '+(d+1));
    guardar();

function recompensar(tipo,puntos){
  const mult=multiplicador()*rachaMult()*eventoMult();
  const p=Math.round(puntos*mult);
  if(tipo==='calculo'){pet.hambre=Math.min(100,pet.hambre+p);pet.energia=Math.max(0,pet.energia-p*.3)}
  if(tipo==='grid'){pet.felicidad=Math.min(100,pet.felicidad+p);pet.salud=Math.min(100,pet.salud+p*.2)}
  if(tipo==='memoria'){pet.energia=Math.min(100,pet.energia+p);pet.hambre=Math.min(100,pet.hambre+p*.2)}
  if(tipo==='ovejas'){pet.energia=Math.min(100,pet.energia+p*2);pet.salud=Math.min(100,pet.salud+p*.3)}
  pet.estrellas+=Math.ceil(p/5);
  ganarXP(puntos*2);
  guardar();
}

// ===== MATH HELPERS =====
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function genOps(correct,n=4){
  const s=new Set([correct]);let att=0;
  while(s.size<n&&att<100){const off=rand(1,Math.max(2,Math.ceil(Math.abs(correct)*.2+2)));const v=correct+(Math.random()>.5?off:-off);if(v>=0&&v!==correct&&!s.has(v))s.add(v);att++}
  while(s.size<n)s.add(s.size*100+rand(1,99));
  return[...s].sort(()=>Math.random()-.5);
}
function genProb(dif){
  const ops=['+','−','×'];const op=ops[rand(0,dif>=2?2:1)];
  let a,b,ans;const mx=dif<2?15:dif<4?30:50;const mn=dif<2?1:dif<4?3:10;
  switch(op){case'+':a=rand(mn,mx);b=rand(mn,mx);ans=a+b;break;case'−':a=rand(mn+5,mx+10);b=rand(mn,a-1);ans=a-b;break;case'×':a=rand(1,Math.min(10,dif+3));b=rand(1,Math.min(8,dif+2));ans=a*b;break}
  return{a,b,op,ans};
}

// ===== GAME 1: CARRERA DE CÁLCULO =====
function juegoCalculo(dif, cb){
  let streak=0,pts=0,q=0,total=3+dif;
  const sym={'+':'+','−':'−','×':'×'};
  function next(){
    if(gameCancelled){cb(0);return}
    if(q>=total){cb(pts+streak*2);return}
    q++;const p=genProb(dif);const o=genOps(p.ans);const last=q===total;
    document.getElementById('panelContenido').innerHTML=`
      <h2>🧮 Carrera de Cálculo</h2>
      <div class="sub">${q}/${total} · 🔥${streak}${last?' · <b style="color:var(--gold)">ÚLTIMA x2!</b>':''}</div>
      <div class="math">${p.a} <span class="sym">${sym[p.op]}</span> ${p.b} <span class="eq">=</span> ?</div>
      <div class="timer-bar"><div class="timer-fill" id="ct" style="width:100%"></div></div>
      <div class="opts" id="co"></div>
      <div class="msg" id="cm"></div>`;
    let time=8;const te=document.getElementById('ct');
    const ti=setInterval(()=>{time-=.1;te.style.width=Math.max(0,(time/8)*100)+'%';if(time<=0){clearInterval(ti);document.getElementById('cm').className='msg bad';document.getElementById('cm').textContent='⏰ Tiempo!';streak=0;resetRacha();setTimeout(next,500)}},100);
    const box=document.getElementById('co');
    o.forEach(v=>{const b=document.createElement('div');b.className='opt';b.textContent=v;b.addEventListener('click',()=>{if(b.classList.contains('correct')||b.classList.contains('wrong'))return;clearInterval(ti);if(v===p.ans){const g=2+streak;streak++;sumarRacha();pts+=(last?g*2:g);b.classList.add('correct');document.getElementById('cm').className='msg good';document.getElementById('cm').textContent='✅ +'+(last?g*2:g)+'pts';setTimeout(next,400)}else{streak=0;resetRacha();b.classList.add('wrong');document.getElementById('cm').textContent='❌';setTimeout(next,600)}});box.appendChild(b)});
  }
  next();
}

function juegoGrid(dif, cb){
  const op='+';let nums=[],tgt=rand(6,20),sel=null,matched=0,pts=0;
  for(let i=0;i<8;i++){let a=rand(1,tgt-1);nums.push(a,tgt-a)}
  for(let i=nums.length-1;i>0;i--){const j=rand(0,i);[nums[i],nums[j]]=[nums[j],nums[i]]}
  function rend(){
    document.getElementById('panelContenido').innerHTML=`
      <h2>⊞ Grid Numérico</h2>
      <div class="sub">Pares que <b>sumen</b> <b style="color:var(--gold);font-size:18px">${tgt}</b></div>
      <div class="grid-4" id="gb"></div>
      <div class="msg" id="gm">${matched}/8</div>`;
    const box=document.getElementById('gb');
    nums.forEach((v,i)=>{
      if(v===null)return;
      const d=document.createElement('div');d.className='gcell';d.textContent=v;
      d.addEventListener('click',()=>{
        if(gameCancelled)return;
        if(d.classList.contains('ok'))return;
        if(sel===null){d.classList.add('sel');sel=i;return}
        if(sel===i){d.classList.remove('sel');sel=null;return}
        const fi=sel,fd=box.children[fi],v1=nums[fi],v2=v;
        if(v1+v2===tgt){fd.classList.remove('sel');fd.classList.add('ok');d.classList.add('ok');nums[fi]=null;nums[i]=null;matched++;pts+=3;sumarRacha();document.getElementById('gm').textContent=`${matched}/8 ✅`;sel=null;if(matched>=8){document.getElementById('gm').textContent='🎉 Completado! +20';setTimeout(()=>cb(pts+20),400)}}else{resetRacha();fd.classList.remove('sel');fd.classList.add('bad');d.classList.add('bad');document.getElementById('gm').textContent='❌';setTimeout(()=>{fd.classList.remove('bad');d.classList.remove('bad')},400);sel=null}
      });
      box.appendChild(d);
    });
  }
  rend();
}

function abrirJuego(tipo){
  if(pet.vidas<=0){avisar('💔 Sin vidas. Vuelve en un rato');return}
  gameCancelled=false;
  pet.juegos++;
  pet.juegosPor[tipo]=true;
  document.getElementById('overlay').classList.add('show');
  const dif=calcularDif();
  document.getElementById('panelContenido').innerHTML=`
    <h2>Cargando...</h2>
    <div class="msg">🐣</div>`;
  const finJuego=(tipo,npts)=>{
    document.getElementById('overlay').classList.remove('show');
    if(npts>0){
      recompensar(tipo,npts);
      const m={calculo:'🍖 +comida!',grid:'😊 +felicidad!',memoria:'⚡ +energía!',ovejas:'💤 +sueño!'}[tipo];
      toast('🎉 '+npts+'pts · '+m);
      if(tipo==='ovejas')explosionZzz();
    }else{
      pet.vidas=Math.max(0,pet.vidas-1);
      guardar();actualizarMascota();
      toast(pet.vidas>0?'😞 Sin puntos. -1 vida ('+pet.vidas+')':'💔 Sin vidas');
    }
  };
  setTimeout(()=>{
  if(gameCancelled)return;
  if(tipo==='calculo'){
    juegoCalculo(dif,(pts)=>finJuego('calculo',pts));
  }else if(tipo==='grid'){
    juegoGrid(dif,(pts)=>finJuego('grid',pts));
  }else if(tipo==='memoria'){
    juegoMemoria(dif,(pts)=>finJuego('memoria',pts));
  }else if(tipo==='ovejas'){
    juegoOvejas(dif,(pts)=>finJuego('ovejas',pts));
  }
  }, 200);
}

setInterval(()=>{
  if(pet.eventoActivo){
    const rest=Math.ceil((pet.eventoFin-Date.now())/1000);
    if(rest<=0){pet.eventoActivo=false;pet.ultimoEvento=Date.now();document.getElementById('eventoBadge').style.display='none';}
    else{const b=document.getElementById('eventoBadge');b.textContent='✨ '+rest+'s';b.style.display='block';}
  }else{
    spawnEvento();
  }
},1000);
setInterval(()=>{
  if(pet._sleep>0)return;
  if(pet.hambre<25)avisar('😫 ¡Tengo hambre! Jugá 🧮 Carrera');
  else if(pet.felicidad<25)avisar('😞 Estoy triste... jugá ⊞ Grid');
  else if(pet.energia<25)avisar('😴 Cansado... jugá ⟳ Memoria');
},18000);

cargar();
bienvenida();
actualizarMascota();
guardar();
</script>
